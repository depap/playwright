# Orchestrates the app under test + the Playwright test runner.
# Run from this directory:  docker compose up --build --abort-on-container-exit --exit-code-from tests

services:
  # The app under test: the-internet (Sinatra/puma), cloned into ../the-internet.
  # It ships its own multi-stage Dockerfile (ruby slim, puma on PORT=5000).
  app:
    build: ../the-internet
    # Optional: publish to host so you can open http://localhost:5000 in a browser.
    # Not needed for the tests (they share the app's network namespace).
    ports:
      - "5000:5000"
    # slim image has no curl — use ruby (present in the image) for the healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "ruby -rnet/http -e 'exit(Net::HTTP.get_response(URI(\"http://localhost:5000/\")).is_a?(Net::HTTPSuccess) ? 0 : 1)'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # The Playwright runner: built from this project's Dockerfile (mcr playwright image).
  tests:
    build: .
    # Share the app's network namespace: the app is then reachable at 127.0.0.1:5000.
    # Chromium exempts loopback from HTTPS-First upgrades, so plain http works.
    network_mode: "service:app"
    environment:
      - BASE_URL=http://127.0.0.1:5000
    depends_on:
      app:
        condition: service_healthy
    # Persist reports/traces to the host so `npx playwright show-report` works after the run.
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    # Extra args are appended to the image ENTRYPOINT (`npx playwright test`), e.g.:
    #   docker compose run --rm tests --project=chromium --reporter=line
